<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2be"/>
      <stop offset="30%" stop-color="#e8be66"/>
      <stop offset="70%" stop-color="#b6832a"/>
      <stop offset="100%" stop-color="#7a4f0d"/>
    </linearGradient>
    <linearGradient id="logoAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9326"/>
      <stop offset="100%" stop-color="#b33f00"/>
    </linearGradient>
    <linearGradient id="logoIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#baa48b"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem (Tiger & Goat Crest) -->
  <g transform="translate(10, 8)" filter="url(#logoShadow)">
    <!-- Diamond Frame -->
    <polygon points="42,0 84,42 42,84 0,42" fill="#18231c" stroke="url(#logoGold)" stroke-width="2.5"/>
    <polygon points="42,7 77,42 42,77 7,42" fill="#0f1612" stroke="url(#logoGold)" stroke-width="0.8" stroke-dasharray="2,2"/>

    <!-- Central Mini Alquerque Grid Lines -->
    <g stroke="url(#logoGold)" stroke-width="0.8" opacity="0.45">
      <line x1="18" y1="42" x2="66" y2="42"/>
      <line x1="42" y1="18" x2="42" y2="66"/>
      <line x1="25" y1="25" x2="59" y2="59"/>
      <line x1="25" y1="59" x2="59" y2="25"/>
    </g>

    <!-- Tiger Claw / Flame (Left side) -->
    <path d="M 38 24 C 26 28 20 40 24 54 C 28 46 34 40 38 38 C 34 48 37 56 42 60 C 40 50 44 42 40 32 Z" fill="url(#logoAmber)"/>

    <!-- Goat Horn Sweep (Right side) -->
    <path d="M 46 24 C 58 28 64 40 60 54 C 56 46 50 40 46 38 C 50 48 47 56 42 60 C 44 50 40 42 44 32 Z" fill="url(#logoIvory)"/>

    <!-- Center Jewel Rivet -->
    <circle cx="42" cy="42" r="3.5" fill="url(#logoGold)"/>
  </g>

  <!-- Text Header -->
  <!-- BAGH-CHAL -->
  <text x="110" y="52" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="36" font-weight="700" letter-spacing="4" fill="url(#logoGold)">
    BAGH-CHAL
  </text>

  <!-- TIGER'S GAMBIT -->
  <text x="112" y="74" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#8da498">
    TIGER'S GAMBIT · ANCIENT NEPAL
  </text>
  
  <!-- Subtle divider line -->
  <line x1="112" y1="58" x2="390" y2="58" stroke="url(#logoGold)" stroke-width="1" opacity="0.3"/>
</svg>
