<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Outer Rim Gradients (Silver/Pewter/Warm Brass) -->
    <linearGradient id="goatRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2ebe1"/>
      <stop offset="35%" stop-color="#c4b5a2"/>
      <stop offset="70%" stop-color="#7a6c5a"/>
      <stop offset="100%" stop-color="#42392e"/>
    </linearGradient>
    <linearGradient id="goatInnerRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#383025"/>
      <stop offset="50%" stop-color="#695c4d"/>
      <stop offset="100%" stop-color="#b0a08d"/>
    </linearGradient>
    <!-- Base Plate Gradient (Cream/Ivory Carved Stone) -->
    <radialGradient id="goatPlateGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5ede0"/>
      <stop offset="85%" stop-color="#ded0bb"/>
      <stop offset="100%" stop-color="#b8a892"/>
    </radialGradient>
    <!-- Horn Gradient -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#544434"/>
      <stop offset="40%" stop-color="#7d6a54"/>
      <stop offset="75%" stop-color="#a38e74"/>
      <stop offset="100%" stop-color="#4a3b2b"/>
    </linearGradient>
    <!-- Horn Ridge Highlight -->
    <linearGradient id="hornRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9b89f"/>
      <stop offset="100%" stop-color="#69553f"/>
    </linearGradient>
    <!-- Eye Gradient -->
    <radialGradient id="goatEyeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="70%" stop-color="#d49e1e"/>
      <stop offset="100%" stop-color="#735004"/>
    </radialGradient>
    <!-- Drop Shadow -->
    <filter id="pieceShadowG" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Drop Shadow Base -->
  <g filter="url(#pieceShadowG)">
    <!-- Outer Heavy Silver/Ivory-Metal Rim -->
    <circle cx="60" cy="60" r="54" fill="url(#goatRimGrad)"/>
    <!-- Inner Groove -->
    <circle cx="60" cy="60" r="49" fill="url(#goatInnerRim)"/>
    <!-- Token Face -->
    <circle cx="60" cy="60" r="46" fill="url(#goatPlateGrad)"/>
  </g>

  <!-- Top Rim Highlight -->
  <path d="M 22 45 A 46 46 0 0 1 98 45 A 46 44 0 0 0 22 45 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Majestic Curved Horns -->
  <!-- Left Horn -->
  <g>
    <path d="M 48 38 C 36 28 20 18 17 28 C 15 36 30 42 45 44 Z" fill="url(#hornGrad)" stroke="#382c1f" stroke-width="1.2"/>
    <!-- Horn Ridges -->
    <path d="M 23 27 C 26 23 31 25 33 30" stroke="url(#hornRidge)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 28 31 C 32 27 38 29 40 35" stroke="url(#hornRidge)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 35 36 C 39 33 44 35 46 40" stroke="url(#hornRidge)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right Horn -->
  <g>
    <path d="M 72 38 C 84 28 100 18 103 28 C 105 36 90 42 75 44 Z" fill="url(#hornGrad)" stroke="#382c1f" stroke-width="1.2"/>
    <!-- Horn Ridges -->
    <path d="M 97 27 C 94 23 89 25 87 30" stroke="url(#hornRidge)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 92 31 C 88 27 82 29 80 35" stroke="url(#hornRidge)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 85 36 C 81 33 76 35 74 40" stroke="url(#hornRidge)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Goat Ears -->
  <!-- Left Ear -->
  <path d="M 38 48 C 22 46 16 54 22 59 C 28 62 36 56 40 52 Z" fill="#efe4d3" stroke="#5a4936" stroke-width="1.2"/>
  <path d="M 36 49 C 26 48 22 53 26 57 C 29 58 35 55 37 52 Z" fill="#d6c2ab"/>
  <!-- Right Ear -->
  <path d="M 82 48 C 98 46 104 54 98 59 C 92 62 84 56 80 52 Z" fill="#efe4d3" stroke="#5a4936" stroke-width="1.2"/>
  <path d="M 84 49 C 94 48 98 53 94 57 C 91 58 85 55 83 52 Z" fill="#d6c2ab"/>

  <!-- Goat Head Silhouette -->
  <path d="M 44 38 C 42 34 78 34 76 38 C 76 44 80 50 78 62 C 76 74 69 86 64 88 C 61 89 59 89 56 88 C 51 86 44 74 42 62 C 40 50 44 44 44 38 Z" fill="#fcf9f2" stroke="#4a3c2b" stroke-width="1.4"/>

  <!-- Face Shading & Forehead Plate -->
  <path d="M 47 40 C 47 50 51 68 53 78 L 67 78 C 69 68 73 50 73 40 Z" fill="#f4ebd9" opacity="0.6"/>

  <!-- Crown Fluff / Forelock -->
  <path d="M 49 37 C 53 33 67 33 71 37 C 67 39 53 39 49 37 Z" fill="#ffffff"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="44" cy="53" rx="5" ry="4" fill="#ffffff" stroke="#4a3a2a" stroke-width="1"/>
  <ellipse cx="44" cy="53" rx="3.8" ry="3.2" fill="url(#goatEyeGrad)"/>
  <!-- Horizontal Goat Pupil -->
  <rect x="41" y="52" width="6" height="2" rx="0.8" fill="#1b120c"/>
  <circle cx="43" cy="51.5" r="0.8" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="76" cy="53" rx="5" ry="4" fill="#ffffff" stroke="#4a3a2a" stroke-width="1"/>
  <ellipse cx="76" cy="53" rx="3.8" ry="3.2" fill="url(#goatEyeGrad)"/>
  <!-- Horizontal Goat Pupil -->
  <rect x="73" y="52" width="6" height="2" rx="0.8" fill="#1b120c"/>
  <circle cx="75" cy="51.5" r="0.8" fill="#ffffff"/>

  <!-- Bridge of Nose & Muzzle -->
  <path d="M 52 50 L 52 76 C 52 82 68 82 68 76 L 68 50 Z" fill="#f3e8d5" opacity="0.4"/>
  <!-- Soft Muzzle Oval -->
  <ellipse cx="60" cy="80" rx="9" ry="6" fill="#ebe0ce" stroke="#5a4936" stroke-width="1"/>
  <!-- Nostrils -->
  <path d="M 55 79 C 55 81 57 82 58 81" stroke="#4a3828" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M 65 79 C 65 81 63 82 62 81" stroke="#4a3828" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <line x1="60" y1="81" x2="60" y2="84" stroke="#4a3828" stroke-width="1.2"/>

  <!-- Elegant Goat Beard -->
  <path d="M 54 87 C 56 97 58 101 60 102 C 62 101 64 97 66 87 Z" fill="#f7f1e4" stroke="#6b5742" stroke-width="1"/>
  <path d="M 57 89 C 58 96 59 99 60 100 C 61 99 62 96 63 89" stroke="#b09c85" stroke-width="0.8" fill="none"/>
</svg>
