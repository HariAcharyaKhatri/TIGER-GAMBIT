<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Outer Rim Gradients -->
    <linearGradient id="tigerRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5b842"/>
      <stop offset="35%" stop-color="#cf7a17"/>
      <stop offset="70%" stop-color="#733b06"/>
      <stop offset="100%" stop-color="#3d1d02"/>
    </linearGradient>
    <linearGradient id="tigerInnerRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1302"/>
      <stop offset="50%" stop-color="#592b07"/>
      <stop offset="100%" stop-color="#b86b16"/>
    </linearGradient>
    <!-- Base Plate Gradient -->
    <radialGradient id="tigerPlateGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff9326"/>
      <stop offset="45%" stop-color="#e86b0c"/>
      <stop offset="85%" stop-color="#ad3c02"/>
      <stop offset="100%" stop-color="#6e2001"/>
    </radialGradient>
    <!-- Eye Glow -->
    <radialGradient id="tigerEyeGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="70%" stop-color="#e6b800"/>
      <stop offset="100%" stop-color="#996e00"/>
    </radialGradient>
    <!-- Drop Shadow -->
    <filter id="pieceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Drop Shadow Base -->
  <g filter="url(#pieceShadow)">
    <!-- Outer Heavy Brass Rim -->
    <circle cx="60" cy="60" r="54" fill="url(#tigerRimGrad)"/>
    <!-- Inner Groove -->
    <circle cx="60" cy="60" r="49" fill="url(#tigerInnerRim)"/>
    <!-- Token Face -->
    <circle cx="60" cy="60" r="46" fill="url(#tigerPlateGrad)"/>
  </g>

  <!-- Top Rim Highlight -->
  <path d="M 22 45 A 46 46 0 0 1 98 45 A 46 44 0 0 0 22 45 Z" fill="#ffffff" opacity="0.22"/>

  <!-- Tiger Ears -->
  <g>
    <!-- Left Ear -->
    <path d="M 28 32 C 22 22 29 12 39 18 C 45 22 43 32 37 38 Z" fill="#b34704" stroke="#4a1801" stroke-width="1.5"/>
    <path d="M 30 28 C 26 21 31 16 37 20 C 40 23 39 30 35 32 Z" fill="#fff5ea"/>
    <!-- Right Ear -->
    <path d="M 92 32 C 98 22 91 12 81 18 C 75 22 77 32 83 38 Z" fill="#b34704" stroke="#4a1801" stroke-width="1.5"/>
    <path d="M 90 28 C 94 21 89 16 83 20 C 80 23 81 30 85 32 Z" fill="#fff5ea"/>
  </g>

  <!-- Tiger Head Silhouette / Cheek Ruffs -->
  <path d="M 36 38 C 22 50 20 66 28 77 C 33 84 41 87 47 92 C 55 96 65 96 73 92 C 79 87 87 84 92 77 C 100 66 98 50 84 38 C 76 30 44 30 36 38 Z" fill="#d95e09" stroke="#3b1300" stroke-width="1.5"/>

  <!-- Cheek White Fur Patches -->
  <path d="M 29 65 C 26 73 33 80 40 82 C 37 76 36 68 39 61 C 34 60 30 62 29 65 Z" fill="#fff8ee"/>
  <path d="M 91 65 C 94 73 87 80 80 82 C 83 76 84 68 81 61 C 86 60 90 62 91 65 Z" fill="#fff8ee"/>

  <!-- Forehead Fur Gradient & Markings -->
  <!-- Center Crown Stripe (The King / Wang mark) -->
  <path d="M 57 26 L 63 26 L 62 36 L 58 36 Z" fill="#1f0a00"/>
  <path d="M 50 31 C 55 33 65 33 70 31 L 69 34 C 64 36 56 36 51 34 Z" fill="#1f0a00"/>
  <path d="M 46 39 C 53 41 67 41 74 39 L 73 42.5 C 66 44.5 54 44.5 47 42.5 Z" fill="#1f0a00"/>
  <!-- Central forehead vertical streak -->
  <path d="M 58 38 L 62 38 L 61 48 L 59 48 Z" fill="#1f0a00"/>

  <!-- Side Forehead Stripes -->
  <path d="M 37 42 C 43 45 47 49 46 54 C 43 51 40 48 35 46 Z" fill="#1f0a00"/>
  <path d="M 83 42 C 77 45 73 49 74 54 C 77 51 80 48 85 46 Z" fill="#1f0a00"/>
  <path d="M 31 52 C 37 54 41 58 40 63 C 37 60 34 58 30 56 Z" fill="#1f0a00"/>
  <path d="M 89 52 C 83 54 79 58 80 63 C 83 60 86 58 90 56 Z" fill="#1f0a00"/>

  <!-- Brow and Eye Surround -->
  <path d="M 39 52 C 45 50 51 52 54 56 C 48 57 43 56 39 52 Z" fill="#fff5ea"/>
  <path d="M 81 52 C 75 50 69 52 66 56 C 72 57 77 56 81 52 Z" fill="#fff5ea"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <polygon points="41,56 49,53 52,58 43,60" fill="#1f0a00"/>
  <path d="M 42 56 C 46 53 49 54 51 57 C 48 59 44 58 42 56 Z" fill="url(#tigerEyeGlow)"/>
  <ellipse cx="46.5" cy="56" rx="2" ry="2.2" fill="#110500"/>
  <circle cx="45.5" cy="55" r="0.8" fill="#ffffff"/>

  <!-- Right Eye -->
  <polygon points="79,56 71,53 68,58 77,60" fill="#1f0a00"/>
  <path d="M 78 56 C 74 53 71 54 69 57 C 72 59 76 58 78 56 Z" fill="url(#tigerEyeGlow)"/>
  <ellipse cx="73.5" cy="56" rx="2" ry="2.2" fill="#110500"/>
  <circle cx="72.5" cy="55" r="0.8" fill="#ffffff"/>

  <!-- White Muzzle -->
  <path d="M 48 64 C 44 72 45 84 52 87 C 56 89 64 89 68 87 C 75 84 76 72 72 64 C 65 66 55 66 48 64 Z" fill="#fffaf2" stroke="#5a2c07" stroke-width="1"/>
  <path d="M 55 86 C 58 89 62 89 65 86 C 68 90 62 92 60 92 C 58 92 52 90 55 86 Z" fill="#1f0a00"/>

  <!-- Nose -->
  <path d="M 55 63 C 58 61 62 61 65 63 C 67 67 62 70 60 70 C 58 70 53 67 55 63 Z" fill="#bd3e2b"/>
  <!-- Nostrils -->
  <circle cx="58" cy="66.5" r="1" fill="#421008"/>
  <circle cx="62" cy="66.5" r="1" fill="#421008"/>

  <!-- Whiskers -->
  <g stroke="#3a1a08" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <line x1="48" y1="74" x2="33" y2="72"/>
    <line x1="47" y1="77" x2="32" y2="79"/>
    <line x1="49" y1="80" x2="35" y2="86"/>
    <line x1="72" y1="74" x2="87" y2="72"/>
    <line x1="73" y1="77" x2="88" y2="79"/>
    <line x1="71" y1="80" x2="85" y2="86"/>
  </g>
</svg>
